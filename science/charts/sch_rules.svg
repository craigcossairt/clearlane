<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img">
<title>System Critical Hours: four rules over May to October 2026</title>
<desc>Line chart of the share of season days each rule flags each hour beginning, Mountain time, for four rules labeled in text: Ours, ours: the 4 highest net-load hours plus every jam hour; Top 6 price, the 6 highest-price hours; Net load P75, every hour at or above the season's 75th percentile of net load; Top 4 net load, the 4 highest net-load hours only (ours without the jam part). Below, bars of the 2025 RMP calls by hour in Mountain time, confirmed by Torus. PacifiCorp East day-ahead prices and EIA-930 net load.</desc>
