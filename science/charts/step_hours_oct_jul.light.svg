<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img">
<title>Hour of each day's largest price step, October vs July 2026</title>
<desc>Bar chart by hour beginning, Mountain time. 24 of 27 October days: HB 5pm or 6pm. July: 28 of 30 between HB 1pm and 8pm. October bars are solid, July bars are hatched. PacifiCorp East day-ahead prices.</desc>
